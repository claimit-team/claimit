name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-plan.yml'

# PR-time plan is safe to cancel and re-run, so cancel old runs.
concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

# Need to write PR comments to post plan output.
permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: '1.9.5'
  WORKING_DIR: infra/terraform

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Terraform Format Check
        id: fmt
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read plan output from file (more reliable than stdout for large plans)
            let planText = '';
            try {
              planText = fs.readFileSync(
                path.join('${{ env.WORKING_DIR }}', 'plan_output.txt'),
                'utf8'
              );
            } catch (e) {
              planText = 'Plan output file not found.';
            }

            // GitHub PR comments have a 65536 char limit. Truncate if needed.
            const MAX_LEN = 60000;
            let truncated = false;
            if (planText.length > MAX_LEN) {
              planText = planText.slice(0, MAX_LEN) + '\n\n... [TRUNCATED] ...';
              truncated = true;
            }

            const fmtOutcome = '${{ steps.fmt.outcome }}';
            const initOutcome = '${{ steps.init.outcome }}';
            const validateOutcome = '${{ steps.validate.outcome }}';
            const planOutcome = '${{ steps.plan.outcome }}';

            const icon = (o) => o === 'success' ? '✅' : o === 'failure' ? '❌' : '⚠️';

            const body = `### Terraform Plan 📋

            | Step | Result |
            |---|---|
            | Format | ${icon(fmtOutcome)} \`${fmtOutcome}\` |
            | Init | ${icon(initOutcome)} \`${initOutcome}\` |
            | Validate | ${icon(validateOutcome)} \`${validateOutcome}\` |
            | Plan | ${icon(planOutcome)} \`${planOutcome}\` |

            <details><summary>Show Plan ${truncated ? '(truncated)' : ''}</summary>

            \`\`\`hcl
            ${planText}
            \`\`\`

            </details>

            *Pushed by @${{ github.actor }} · Workflow: \`${{ github.workflow }}\`*
            `;

            // Find existing comment from this workflow (to update instead of duplicate)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '### Terraform Plan 📋';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: |
          echo "Terraform plan failed. See PR comment for details."
          exit 1
