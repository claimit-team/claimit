<svg width="1280" height="440" viewBox="0 0 1280 440" role="img" xmlns="http://www.w3.org/2000/svg"><title>ClaimIt — Your Money, Still Yours.</title><desc>Premium navy banner with the ClaimIt wordmark, tagline, and a green plus fifty dollars back refund payoff.</desc>
<defs>
<linearGradient id="navy" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#2C4F7C"/><stop offset="1" stop-color="#11203A"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F59E0B"/><stop offset="1" stop-color="#1D7A3A"/></linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="440" rx="20" fill="url(#navy)"/>
<rect x="88" y="62" width="330" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08"/>
<text x="126" y="85" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#C7D6EA">Multi-agent AI price-protection</text>
<text x="86" y="212" font-family="Inter, system-ui, sans-serif" font-size="92" font-weight="700" letter-spacing="-3" fill="#FFFFFF">ClaimIt</text>
<rect x="90" y="232" width="200" height="5" rx="2.5" fill="url(#accent)"/>
<text x="88" y="302" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="500" fill="#EAF1F9">Your Money, Still Yours.</text>
<text x="88" y="344" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#9DB2CC">The refund you're owed — found, written, and filed for you.</text>
<rect x="950" y="150" width="224" height="60" rx="30" fill="#1D7A3A"/>
<text x="1062" y="189" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">+ $50.00 back</text>
<polyline points="920,256 992,284 1052,312 1100,330" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round" opacity="0.5"/>
<polyline points="1100,330 1146,300 1192,266 1216,248" fill="none" stroke="#35C26A" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
<circle cx="1216" cy="248" r="5" fill="#35C26A"/>
</svg>
