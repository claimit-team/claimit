[project]
name = "claimit-notifier"
version = "0.1.0"
description = "ClaimIt shared notifier — per-event email templates + SendGrid transport."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "claimit-mongodb-models",
]
license = { text = "MIT" }

[tool.uv.sources]
claimit-mongodb-models = { path = "../mongodb" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimit_notifier"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6.0",
]
