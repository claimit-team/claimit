[project]
name = "claimit-mongodb-models"
version = "0.1.0"
description = "ClaimIt MongoDB Pydantic v2 models — mirrors the TypeScript definitions in @claimit/mongodb-types (same directory)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "motor>=3.6.0",
]
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "claimit_mongodb_models/__init__.py"
"base.py" = "claimit_mongodb_models/base.py"
"client.py" = "claimit_mongodb_models/client.py"
"create_indexes.py" = "claimit_mongodb_models/create_indexes.py"
"enums.py" = "claimit_mongodb_models/enums.py"
"user.py" = "claimit_mongodb_models/user.py"
"purchase.py" = "claimit_mongodb_models/purchase.py"
"price_history.py" = "claimit_mongodb_models/price_history.py"
"policy.py" = "claimit_mongodb_models/policy.py"
"claim.py" = "claimit_mongodb_models/claim.py"
"conversation.py" = "claimit_mongodb_models/conversation.py"
