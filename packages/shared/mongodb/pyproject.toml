[project]
name = "claimit-mongodb-models"
version = "0.1.0"
description = "ClaimIt MongoDB Pydantic v2 models — mirrors the TypeScript definitions in @claimit/mongodb-types (same directory)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "base.py",
    "enums.py",
    "user.py",
    "purchase.py",
    "price_history.py",
    "policy.py",
    "claim.py",
    "conversation.py",
]

[tool.hatch.build.targets.wheel.sources]
"." = "claimit_mongodb_models"
