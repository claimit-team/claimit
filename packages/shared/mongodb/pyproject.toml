[project]
name = "claimit-mongodb-models"
version = "0.2.0"
description = "ClaimIt MongoDB Pydantic v2 models — mirrors the TypeScript definitions in @claimit/mongodb-types (same directory)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "motor>=3.6.0",
]
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimit_mongodb_models"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
