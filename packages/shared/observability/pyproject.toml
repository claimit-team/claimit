[project]
name = "claimit-observability"
version = "0.1.0"
description = "ClaimIt shared observability — Phoenix/OTel SDK initialization for all agents."
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-otel>=0.6.0",
    # NOTE: the span-read path moved to claimit_mcp.phoenix (Phoenix MCP), so
    # arize-phoenix-client is no longer imported by this package. Retained here
    # only to avoid churning the five app uv.lock files (Docker builds run
    # `uv sync --frozen`); safe to drop in a follow-up that regenerates locks.
    "arize-phoenix-client>=1.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-pymongo>=0.48b0",
]
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimit_observability"]
