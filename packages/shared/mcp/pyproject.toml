[project]
name = "claimit-mcp"
version = "0.1.0"
description = "ClaimIt shared MCP toolset factories for ADK agents."
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.0.0",
    "mcp>=1.0.0",
]
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimit_mcp"]
