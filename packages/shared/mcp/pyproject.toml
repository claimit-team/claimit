[project]
name = "claimit-mcp"
version = "0.1.0"
description = "ClaimIt shared MCP toolset factories for ADK agents."
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.0.0",
    "mcp>=1.0.0",
    # Streamable-HTTP transport path (ticket 5.10): httpx for the
    # AsyncClient + Auth subclass, google-auth for OIDC ID-token
    # fetch_id_token. Both are already transitively available via
    # google-adk + google-cloud-* but declaring explicitly so the wheel
    # built by deploy_agents.py's installation script can resolve them
    # without depending on the resolution order of transitive deps.
    "httpx>=0.27.0",
    "google-auth>=2.29.0",
]
license = { text = "MIT" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimit_mcp"]
