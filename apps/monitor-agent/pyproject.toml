[project]
name = "claimit-monitor-agent"
version = "0.1.0"
description = "ClaimIt monitor agent — detects post-purchase price drops on monitored platforms"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.6.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "playwright>=1.47.0",
    "python-dotenv>=1.0.0",
    "google-adk>=1.0.0",
    "claimit-observability",
    "claimit-mcp",
]

[tool.uv.sources]
claimit-observability = { path = "../../packages/shared/observability" }
claimit-mcp = { path = "../../packages/shared/mcp" }

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
