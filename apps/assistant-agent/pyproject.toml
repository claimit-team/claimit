[project]
name = "claimit-assistant-agent"
version = "0.1.0"
description = "ClaimIt assistant agent — conversational interface for users to interact with claims"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.6.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "playwright>=1.47.0",
    "python-dotenv>=1.0.0",
    "google-adk>=1.0.0",
    "claimit-observability",
    "claimit-mcp",
    "claimit-search",
    "claimit-elastic",
]

[tool.uv.sources]
claimit-observability = { path = "../../packages/shared/observability" }
claimit-mcp = { path = "../../packages/shared/mcp" }
claimit-search = { path = "../../packages/shared/search" }
claimit-elastic = { path = "../../packages/shared/elastic" }

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
