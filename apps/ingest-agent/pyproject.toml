[project]
name = "claimit-ingest-agent"
version = "0.1.0"
description = "ClaimIt ingest agent — parses receipts and order emails into structured purchases"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.6.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "playwright>=1.47.0",
    "python-dotenv>=1.0.0",
    "google-adk>=1.0.0",
    "claimit-observability",
    "claimit-mcp",
    "claimit-mongodb-models",
    "claimit-pubsub",
    "claimit-gmail",
    "google-cloud-secret-manager>=2.20.0",
    "google-auth>=2.29.0",
]

[tool.uv.sources]
claimit-observability = { path = "../../packages/shared/observability" }
claimit-mcp = { path = "../../packages/shared/mcp" }
claimit-mongodb-models = { path = "../../packages/shared/mongodb" }
claimit-pubsub = { path = "../../packages/shared/pubsub" }
claimit-gmail = { path = "../../packages/shared/gmail" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
