[project]
name = "claimit-claim-agent"
version = "0.1.0"
description = "ClaimIt claim agent — generates refund claim drafts when price drops are detected"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.6.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "playwright>=1.47.0",
    "python-dotenv>=1.0.0",
    "google-adk>=1.0.0",
    "claimit-observability",
    "claimit-mcp",
    "claimit-mongodb-models",
    "claimit-pubsub",
    "claimit-elastic",
    "claimit-search",
    "claimit-maps",
    "claimit-gmail",
    "google-cloud-secret-manager>=2.20.0",
]

[tool.uv.sources]
claimit-observability = { path = "../../packages/shared/observability" }
claimit-mcp = { path = "../../packages/shared/mcp" }
claimit-mongodb-models = { path = "../../packages/shared/mongodb" }
claimit-pubsub = { path = "../../packages/shared/pubsub" }
claimit-search = { path = "../../packages/shared/search" }
claimit-elastic = { path = "../../packages/shared/elastic" }
claimit-maps = { path = "../../packages/shared/maps" }
claimit-gmail = { path = "../../packages/shared/gmail" }

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
